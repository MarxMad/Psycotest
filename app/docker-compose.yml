# Postgres local para desarrollo (alternativa a Supabase remoto)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistemapsic
    volumes:
      - sistemapsic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistemapsic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sistemapsic_pg:
