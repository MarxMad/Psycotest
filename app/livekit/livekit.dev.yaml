# Servidor LiveKit local para desarrollo: `npm run livekit:dev`.
# Claves fijas de desarrollo (devkey / secret). En producción se usan las
# de LiveKit Cloud o las del servidor propio, nunca estas.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: secret-de-desarrollo-livekit-0123456789
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/livekit/webhook
logging:
  level: info
